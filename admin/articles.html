<!DOCTYPEhtml>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articles — FR RSL Admin</title>
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.github.com https://raw.githubusercontent.com; img-src 'self' https://raw.githubusercontent.com data: blob:; font-src 'self'">
    <link rel="shortcut icon" href="../assets/images/logos/logo.webp">
    <link rel="stylesheet" href="../assets/css/main.css">
    <script>if(!sessionStorage.getItem('admin_token')){window.location.replace('index.html')}</script>
    <style>
        /* ── Base ── */
        .admin-wrap { max-width: 1100px; margin: 0 auto; padding: 2rem; position: relative; z-index: 10; }
        .admin-topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2.5rem; flex-wrap: wrap; gap: 1rem; }
        .admin-topbar h1 { font-size: 1.6rem; margin: 0; background: linear-gradient(135deg, var(--text-light), var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .topbar-actions { display: flex; gap: 0.7rem; align-items: center; }
        .btn { padding: 0.55rem 1.2rem; border-radius: 2px; border: none; font-weight: 600; font-size: 0.88rem; cursor: pointer; transition: all 0.2s; text-decoration: none; display: inline-block; font-family: inherit; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-danger  { background: rgba(229,57,53,0.2);  color: #ef5350; border: 1px solid rgba(229,57,53,0.3); }
        .btn-danger:hover  { background: rgba(229,57,53,0.35); }
        .btn-ghost   { background: var(--glass-bg); color: var(--text-muted); border: 1px solid var(--glass-border); }
        .btn-ghost:hover   { color: var(--text-light); }
        .btn-success { background: rgba(6,255,165,0.15); color: #06ffa5; border: 1px solid rgba(6,255,165,0.3); }
        .btn-success:hover { background: rgba(6,255,165,0.25); }
        .btn-sm { padding: 0.35rem 0.8rem; font-size: 0.8rem; }
        .status-bar { padding: 0.65rem 1.2rem; border-radius: 2px; font-size: 0.85rem; font-weight: 500; margin-bottom: 1.5rem; display: none; }
        .status-bar.info    { background: rgba(68,96,255,0.15);  color: #818cf8; border: 1px solid rgba(68,96,255,0.3);  display: flex; align-items: center; gap: 0.5rem; }
        .status-bar.success { background: rgba(6,255,165,0.12);  color: #06ffa5; border: 1px solid rgba(6,255,165,0.3);  display: flex; align-items: center; gap: 0.5rem; }
        .status-bar.error   { background: rgba(229,57,53,0.15);  color: #ef5350; border: 1px solid rgba(229,57,53,0.3);  display: flex; align-items: center; gap: 0.5rem; }
        /* ── Category badges ── */
        .article-cat-badge { font-size: 0.67rem; font-weight: 700; padding: 0.15rem 0.45rem; border-radius: 2px; text-transform: uppercase; }
        .cat-Champions   { background: rgba(255,183,0,0.15);  color: #ffb700; }
        .cat-Factions    { background: rgba(68,96,255,0.15);  color: #818cf8; }
        .cat-Equipement  { background: rgba(16,185,129,0.15); color: #34d399; }
        .cat-Guide       { background: rgba(139,92,246,0.15); color: #a78bfa; }
        .cat-Mise-a-jour { background: rgba(245,158,11,0.15); color: #f59e0b; }
        /* ── Vue liste ── */
        .articles-panel { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 2px; overflow: hidden; backdrop-filter: blur(12px); }
        .panel-header { display: flex; align-items: center; justify-content: space-between; padding: 1.2rem 1.5rem; border-bottom: 1px solid var(--glass-border); }
        .panel-header h2 { font-size: 1rem; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 0.5rem; }
        .article-count { background: rgba(68,96,255,0.2); color: #818cf8; border-radius: 2px; padding: 0.1rem 0.55rem; font-size: 0.75rem; font-weight: 700; }
        .article-list { padding: 0.8rem; }
        .article-item { display: flex; align-items: center; gap: 1rem; padding: 1rem 1.2rem; border-radius: 2px; border: 1px solid transparent; cursor: pointer; transition: all 0.2s; }
        .article-item:hover { background: rgba(255,255,255,0.04); border-color: var(--glass-border); }
        .article-item-info { flex: 1; min-width: 0; }
        .article-item-title { font-size: 0.95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .article-item-meta { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.25rem; flex-wrap: wrap; }
        .article-item-date { font-size: 0.75rem; color: var(--text-muted); }
        .article-item-slug { font-size: 0.71rem; color: var(--text-muted); margin-top: 0.15rem; opacity: 0.55; font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .article-item-actions { display: flex; gap: 0.4rem; flex-shrink: 0; }
        /* ── Vue éditeur ── */
        .editor-panel { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 2px; backdrop-filter: blur(12px); overflow: hidden; }
        .editor-header { display: flex; align-items: center; justify-content: space-between; padding: 1.2rem 1.5rem; border-bottom: 1px solid var(--glass-border); flex-wrap: wrap; gap: 0.75rem; }
        .editor-header h2 { font-size: 1.05rem; font-weight: 700; margin: 0; }
        .editor-header-actions { display: flex; gap: 0.7rem; align-items: center; }
        .editor-meta { padding: 1.5rem; border-bottom: 1px solid var(--glass-border); display: flex; flex-direction: column; gap: 1.1rem; }
        .editor-row { display: flex; gap: 1rem; align-items: flex-start; }
        .editor-field { display: flex; flex-direction: column; gap: 0.4rem; }
        .editor-field.grow { flex: 1; min-width: 0; }
        .editor-field.w240 { width: 240px; flex-shrink: 0; }
        .editor-field.w200 { width: 200px; flex-shrink: 0; }
        .editor-field label { font-size: 0.77rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; display: flex; align-items: baseline; gap: 0.4rem; flex-wrap: wrap; }
        .editor-field label small { font-size: 0.72rem; color: var(--text-muted); font-weight: 400; text-transform: none; letter-spacing: 0; opacity: 0.8; }
        .editor-field input, .editor-field select, .editor-field textarea { width: 100%; box-sizing: border-box; padding: 0.7rem 0.9rem; border-radius: 2px; border: 2px solid var(--glass-border); background: rgba(255,255,255,0.04); color: var(--text-light); font-size: 0.9rem; font-family: inherit; outline: none; transition: border-color 0.25s; }
        .editor-field input:focus, .editor-field select:focus, .editor-field textarea:focus { border-color: var(--primary); }
        .editor-field select option { background: #1a1d2e; }
        .editor-field textarea { resize: vertical; min-height: 100px; line-height: 1.55; }
        .slug-preview { font-size: 0.72rem; color: var(--primary); font-family: monospace; padding: 0.3rem 0.6rem; background: rgba(68,96,255,0.07); border-radius: 2px; border: 1px solid rgba(68,96,255,0.2); word-break: break-all; display: none; }
        /* ── Blocks editor ── */
        .editor-blocks { padding: 1.5rem; }
        .editor-blocks-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 0.6rem; }
        .editor-blocks-title { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; }
        .add-block-btns { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .btn-block-type { font-size: 0.82rem; padding: 0.4rem 0.95rem; border-radius: 2px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.04); color: var(--text-muted); cursor: pointer; transition: all 0.2s; font-family: inherit; font-weight: 600; }
        .btn-block-type:hover { color: var(--text-light); border-color: var(--primary); background: rgba(68,96,255,0.08); }
        .blocks-list { display: flex; flex-direction: column; gap: 0.75rem; }
        .block-item { border: 1px solid var(--glass-border); border-radius: 2px; overflow: hidden; transition: border-color 0.2s; }
        .block-item:focus-within { border-color: rgba(68,96,255,0.45); }
        .block-item-header { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 1rem; background: rgba(255,255,255,0.035); }
        .block-type-pill { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; padding: 0.15rem 0.55rem; border-radius: 2px; }
        .type-text     { background: rgba(255,255,255,0.1);  color: var(--text-muted); }
        .type-heading  { background: rgba(68,96,255,0.2);    color: #818cf8; }
        .type-champion { background: rgba(255,183,0,0.2);    color: #ffb700; }
        .type-kit      { background: rgba(16,185,129,0.2);   color: #34d399; }
        .block-btns { display: flex; align-items: center; gap: 0.2rem; }
        .block-btns button { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.88rem; padding: 0.2rem 0.45rem; border-radius: 2px; transition: all 0.15s; }
        .block-btns button:hover:not(:disabled) { color: var(--text-light); background: rgba(255,255,255,0.08); }
        .block-btns button:disabled { opacity: 0.2; cursor: default; }
        .block-btn-del:hover:not(:disabled) { color: #ef5350 !important; background: rgba(229,57,53,0.1) !important; }
        .block-item-body { padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .block-item-body input, .block-item-body textarea { width: 100%; box-sizing: border-box; padding: 0.65rem 0.9rem; border-radius: 2px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.04); color: var(--text-light); font-size: 0.9rem; font-family: inherit; outline: none; transition: border-color 0.2s; }
        .block-item-body input:focus, .block-item-body textarea:focus { border-color: var(--primary); }
        .block-item-body textarea { min-height: 120px; resize: vertical; line-height: 1.65; }
        .block-label { font-size: 0.73rem; color: var(--text-muted); font-weight: 600; letter-spacing: 0.3px; }
        .block-champ-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
        .blocks-empty { text-align: center; color: var(--text-muted); font-size: 0.9rem; padding: 3rem 1rem; border: 1px dashed var(--glass-border); border-radius: 2px; line-height: 2.2; }
        /* ── Champion autocomplete ── */
        .csearch-wrap { position: relative; }
        .csearch-inp { width: 100%; box-sizing: border-box; padding: 0.7rem 0.9rem 0.7rem 2.5rem; border-radius: 2px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.04); color: var(--text-light); font-size: 0.9rem; font-family: inherit; outline: none; transition: border-color 0.2s; }
        .csearch-inp:focus { border-color: var(--primary); }
        .csearch-wrap::before { content: '🔍'; position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); font-size: 0.85rem; pointer-events: none; }
        .csearch-drop { position: absolute; top: calc(100% + 2px); left: 0; right: 0; background: #1a1d2e; border: 1px solid var(--glass-border); border-radius: 2px; z-index: 200; max-height: 280px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        .champ-opt { display: flex; align-items: center; gap: 0.75rem; padding: 0.55rem 0.8rem; cursor: pointer; transition: background 0.12s; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .champ-opt:last-child { border-bottom: none; }
        .champ-opt:hover, .champ-opt.focus { background: rgba(255,255,255,0.07); }
        .champ-opt-img { width: 38px; height: 38px; object-fit: cover; border-radius: 2px; flex-shrink: 0; border: 1px solid var(--glass-border); }
        .champ-opt-ph { width: 38px; height: 38px; background: rgba(232,121,14,0.12); border-radius: 2px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1rem; color: var(--primary); border: 1px solid rgba(232,121,14,0.2); }
        .champ-opt-info { display: flex; flex-direction: column; gap: 0.1rem; min-width: 0; }
        .champ-opt-name { font-size: 0.88rem; font-weight: 600; color: var(--text-light); }
        .champ-opt-faction { font-size: 0.73rem; color: var(--text-muted); }
        .champ-opt-empty { padding: 0.75rem 1rem; font-size: 0.85rem; color: var(--text-muted); text-align: center; }
        /* Selected champion card */
        .csel { display: flex; align-items: center; gap: 1rem; padding: 0.7rem 1rem; background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); border-radius: 2px; }
        .csel-img { width: 52px; height: 52px; object-fit: cover; border-radius: 2px; flex-shrink: 0; border: 1px solid var(--glass-border); }
        .csel-ph { width: 52px; height: 52px; background: rgba(232,121,14,0.12); border-radius: 2px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.3rem; color: var(--primary); border: 1px solid rgba(232,121,14,0.2); }
        .csel-info { flex: 1; display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; }
        .csel-name { font-size: 0.95rem; font-weight: 700; color: var(--text-light); }
        .csel-url { font-size: 0.71rem; color: var(--text-muted); font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0.7; }
        @media (max-width: 860px) { .editor-row { flex-direction: column; } .editor-field.w240, .editor-field.w200 { width: 100%; } }
        @media (max-width: 600px) { .article-item-actions { display: none; } }
    </style>
</head>
<body>
    <div class="particles"></div>
    <header>
        <div class="logo-section">
            <img src="../assets/images/logos/logo.webp" alt="FR RSL">
            <h1>FR RSL</h1>
        </div>
    </header>
    <div class="admin-wrap">
        <div class="admin-topbar">
            <h1>📋 Articles</h1>
            <div class="topbar-actions">
                <a href="dashboard.html" class="btn btn-ghost">← Dashboard</a>
                <button class="btn btn-primary" id="btnNew">+ Nouvel article</button>
                <button class="btn btn-danger" id="btnLogout">Déconnexion</button>
            </div>
        </div>
        <div class="status-bar" id="statusBar"></div>

        <!-- ── Vue : liste ── -->
        <div id="viewList">
            <div class="articles-panel">
                <div class="panel-header">
                    <h2>Articles <span class="article-count" id="articleCount">0</span></h2>
                    <span style="font-size:0.8rem;color:var(--text-muted);">Plus récent en premier</span>
                </div>
                <div class="article-list" id="articleList"></div>
            </div>
        </div>

        <!-- ── Vue : éditeur ── -->
        <div id="viewEditor" style="display:none">
            <div class="editor-panel">
                <div class="editor-header">
                    <h2 id="formTitle">Nouvel article</h2>
                    <div class="editor-header-actions">
                        <button class="btn btn-primary" id="btnSave">💾 Sauvegarder</button>
                        <button class="btn btn-ghost" id="btnCancel">← Retour à la liste</button>
                    </div>
                </div>
                <input type="hidden" id="editId">
                <div class="editor-meta">
                    <div class="editor-row">
                        <div class="editor-field grow">
                            <label for="fTitle">Titre *</label>
                            <input type="text" id="fTitle" placeholder="Titre de l'article" maxlength="120">
                        </div>
                        <div class="editor-field w240">
                            <label for="fCategory">Catégorie</label>
                            <select id="fCategory">
                                <option value="Champions">Champions</option>
                                <option value="Factions">Factions</option>
                                <option value="Équipement">Équipement</option>
                                <option value="Guide">Guide</option>
                                <option value="Mise à jour">Mise à jour</option>
                            </select>
                        </div>
                        <div class="editor-field w200">
                            <label for="fDate">Date</label>
                            <input type="date" id="fDate">
                        </div>
                    </div>
                    <div class="editor-row">
                        <div class="editor-field grow">
                            <label for="fExcerpt">Extrait * <small>— affiché sur la homepage</small></label>
                            <textarea id="fExcerpt" placeholder="Description courte visible sur la homepage (1-2 phrases)…" maxlength="280"></textarea>
                        </div>
                        <div class="editor-field w240" style="display:flex;flex-direction:column;gap:0.8rem;">
                            <div class="editor-field">
                                <label for="fSlug">Slug <small>— génère pages/articles/{slug}.html</small></label>
                                <input type="text" id="fSlug" placeholder="mon-article-2026" maxlength="80">
                                <div class="slug-preview" id="slugPreview"></div>
                            </div>
                            <div class="editor-field">
                                <label for="fLink">Lien manuel <small>— si pas de slug</small></label>
                                <input type="text" id="fLink" placeholder="pages/factions/...">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="editor-blocks">
                    <div class="editor-blocks-header">
                        <span class="editor-blocks-title">Contenu de l'article</span>
                        <div class="add-block-btns">
                            <button type="button" class="btn-block-type" data-block-type="text">+ Paragraphe</button>
                            <button type="button" class="btn-block-type" data-block-type="heading">+ Titre</button>
                            <button type="button" class="btn-block-type" data-block-type="champion">+ Champion</button>
                            <button type="button" class="btn-block-type" data-block-type="kit">+ Image kit</button>
                        </div>
                    </div>
                    <div class="blocks-list" id="blocksList"></div>
                </div>
            </div>
        </div>
    </div>
    <div id="commitModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:1000; align-items:center; justify-content:center;">
        <div style="background:#1a1d2e; border:1px solid var(--glass-border); border-radius: 2px; padding:2rem; max-width:440px; width:90%; text-align:center;">
            <div style="font-size:2rem; margin-bottom:1rem;">⏳</div>
            <h3 style="margin:0 0 0.5rem;">Publication en cours…</h3>
            <p style="color:var(--text-muted); font-size:0.9rem;" id="commitMsg">Mise à jour du fichier articles.js sur GitHub</p>
        </div>
    </div>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/security.js"></script>
    <script src="../assets/js/champions-index.js"></script>
    <script src="../assets/js/articles.js"></script>
    <script>
    (function () {
        const GITHUB_OWNER  = 'FR-RSL';
        const GITHUB_REPO   = 'FR-RSL.github.io';
        const GITHUB_BRANCH = 'main';
        const FILE_PATH     = 'assets/js/articles.js';
        const token = sessionStorage.getItem('admin_token');
        if (!token) { window.location.href = 'index.html'; return; }
        document.getElementById('btnLogout').addEventListener('click', () => {
            sessionStorage.removeItem('admin_token');
            window.location.href = 'index.html';
        });
        let articles = JSON.parse(JSON.stringify(ARTICLES));
        let editingId = null;
        let currentBlocks = [];
        let pendingHtmlFiles = {};
        function showView(view) {
            document.getElementById('viewList').style.display   = view === 'list'   ? '' : 'none';
            document.getElementById('viewEditor').style.display = view === 'editor' ? '' : 'none';
        }
        function showStatus(type, msg) {
            const el = document.getElementById('statusBar');
            el.className = 'status-bar ' + type;
            el.innerHTML = (type === 'success' ? '✅ ' : type === 'error' ? '❌ ' : 'ℹ️ ') + msg;
            el.style.display = 'flex';
            if (type !== 'error') setTimeout(() => { el.style.display = 'none'; }, 5000);
        }
        function catClass(cat) {
            return 'cat-' + cat.replace(/\s+/g, '-').normalize('NFD').replace(/\p{Diacritic}/gu, '');
        }
        function formatDate(dateStr) {
            const d = new Date(dateStr + 'T00:00:00');
            return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
        }
        function renderList() {
            const list = document.getElementById('articleList');
            document.getElementById('articleCount').textContent = articles.length;
            if (articles.length === 0) {
                list.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:2rem;font-size:0.9rem;">Aucun article. Créez-en un !</p>';
                return;
            }
            list.innerHTML = articles.map(a => `
                <div class="article-item ${editingId === a.id ? 'selected' : ''}" data-id="${a.id}">
                    <div class="article-item-info">
                        <div class="article-item-title" title="${escHtml(a.title)}">${escHtml(a.title)}</div>
                        <div class="article-item-meta">
                            <span class="article-cat-badge ${catClass(a.category)}">${escHtml(a.category)}</span>
                            <span class="article-item-date">${formatDate(a.date)}</span>
                        </div>
                        ${a.slug ? `<div class="article-item-slug">pages/articles/${escHtml(a.slug)}.html</div>` : ''}
                    </div>
                    <div class="article-item-actions">
                        <button class="btn btn-ghost btn-sm" data-action="edit" data-id="${a.id}">✏️</button>
                        <button class="btn btn-danger btn-sm" data-action="delete" data-id="${a.id}">🗑️</button>
                    </div>
                </div>
            `).join('');
            list.querySelectorAll('.article-item').forEach(el => {
                el.addEventListener('click', (e) => {
                    const btn = e.target.closest('[data-action]');
                    if (btn) {
                        e.stopPropagation();
                        const id = parseInt(btn.dataset.id);
                        if (btn.dataset.action === 'edit')   editArticle(id);
                        if (btn.dataset.action === 'delete') deleteArticle(id);
                    } else {
                        editArticle(parseInt(el.dataset.id));
                    }
                });
            });
        }
        function clearFormFields() {
            editingId = null;
            document.getElementById('editId').value    = '';
            document.getElementById('fTitle').value    = '';
            document.getElementById('fExcerpt').value  = '';
            document.getElementById('fCategory').value = 'Champions';
            document.getElementById('fDate').value     = new Date().toISOString().split('T')[0];
            document.getElementById('fSlug').value     = '';
            document.getElementById('fLink').value     = '';
            document.getElementById('formTitle').textContent = 'Nouvel article';
            const sp = document.getElementById('slugPreview');
            if (sp) { sp.style.display = 'none'; sp.textContent = ''; }
            delete document.getElementById('fSlug').dataset.manual;
            currentBlocks = [];
            renderBlockEditor();
        }
        function clearForm() {
            clearFormFields();
            showView('list');
            renderList();
        }
        function editArticle(id) {
            const a = articles.find(x => x.id === id);
            if (!a) return;
            editingId = id;
            document.getElementById('editId').value   = id;
            document.getElementById('fTitle').value   = a.title;
            document.getElementById('fExcerpt').value = a.excerpt;
            document.getElementById('fCategory').value= a.category;
            document.getElementById('fDate').value    = a.date;
            document.getElementById('fSlug').value    = a.slug || '';
            document.getElementById('fLink').value    = a.link || '';
            document.getElementById('formTitle').textContent = "Modifier l'article";
            const sp = document.getElementById('slugPreview');
            if (sp && a.slug) { sp.style.display = ''; sp.textContent = `→ pages/articles/${a.slug}.html`; }
            else if (sp) { sp.style.display = 'none'; }
            currentBlocks = JSON.parse(JSON.stringify(a.blocks || []));
            renderBlockEditor();
            showView('editor');
        }
        function deleteArticle(id) {
            if (!confirm('Supprimer cet article ?')) return;
            articles = articles.filter(a => a.id !== id);
            if (editingId === id) clearForm();
            else renderList();
        }
        document.getElementById('btnNew').addEventListener('click', () => { clearFormFields(); showView('editor'); });
        document.getElementById('btnCancel').addEventListener('click', clearForm);
        document.getElementById('btnSave').addEventListener('click', () => {
            const title      = SecurityUtils.sanitizeText(document.getElementById('fTitle').value);
            const excerpt    = SecurityUtils.sanitizeText(document.getElementById('fExcerpt').value);
            const category   = document.getElementById('fCategory').value;
            const date       = document.getElementById('fDate').value;
            const rawSlug    = document.getElementById('fSlug').value.trim();
            const slug       = rawSlug ? slugify(rawSlug) : '';
            const manualLink = SecurityUtils.sanitizeUrl(document.getElementById('fLink').value.trim() || '#');
            const link       = slug ? `pages/articles/${slug}.html` : manualLink;
            const blocks     = JSON.parse(JSON.stringify(currentBlocks));
            if (!title || !excerpt || !date) { showStatus('error', 'Veuillez remplir les champs obligatoires (*).'); return; }
            const articleData = { date, title, excerpt, category, link };
            if (slug)           { articleData.slug = slug; }
            if (blocks.length)  { articleData.blocks = blocks; }
            if (editingId !== null) {
                const idx = articles.findIndex(a => a.id === editingId);
                if (idx !== -1) articles[idx] = { id: editingId, ...articleData };
            } else {
                const newId = articles.length > 0 ? Math.max(...articles.map(a => a.id)) + 1 : 1;
                articles.unshift({ id: newId, ...articleData });
            }
            if (slug) {
                const saved = articles.find(a => a.link === link);
                if (saved) pendingHtmlFiles[`pages/articles/${slug}.html`] = buildArticleHtml(saved);
            }
            articles.sort((a, b) => b.date.localeCompare(a.date));
            clearForm();
            showStatus('info', slug
                ? 'Article enregistré. « Publier » créera la page HTML et mettra à jour articles.js.'
                : 'Article enregistré localement. Cliquez sur « Publier » pour sauvegarder sur GitHub.');
            const topActions = document.querySelector('.topbar-actions');
            if (!topActions.querySelector('.publish-btn')){
                const btn = document.createElement('button');
                btn.className = 'btn btn-success publish-btn';
                btn.textContent = '🚀 Publier';
                btn.addEventListener('click', publishToGitHub);
                topActions.insertBefore(btn, topActions.firstChild);
            }
        });
        async function publishToGitHub() {
            const modal = document.getElementById('commitModal');
            const msgEl = document.getElementById('commitMsg');
            modal.style.display = 'flex';
            try {
                msgEl.textContent = 'Mise à jour de articles.js…';
                await commitFile(FILE_PATH, buildArticlesJs(articles),
                    `[Admin] Mise à jour articles — ${new Date().toISOString().split('T')[0]}`);
                const htmlEntries = Object.entries(pendingHtmlFiles);
                for (const [path, content] of htmlEntries) {
                    msgEl.textContent = `Génération de ${path.split('/').pop()}…`;
                    await commitFile(path, content,
                        `[Admin] Génération article — ${path.split('/').pop().replace('.html', '')}`);
                }
                pendingHtmlFiles = {};
                modal.style.display = 'none';
                document.querySelector('.publish-btn')?.remove();
                showStatus('success', htmlEntries.length > 0
                    ? `articles.js et ${htmlEntries.length} page(s) publiés avec succès !`
                    : 'Articles publiés avec succès sur GitHub !');
            } catch (err) {
                modal.style.display = 'none';
                showStatus('error', err.message);
            }
        }
        async function commitFile(path, content, message) {
            const getRes = await fetch(
                `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}?ref=${GITHUB_BRANCH}`,
                { headers: { Authorization: `Bearer ${token}`, 'X-GitHub-Api-Version': '2022-11-28' } }
            );
            let sha = null;
            if (getRes.ok) {
                sha = (await getRes.json()).sha;
            } else if (getRes.status !== 404) {
                const b = await getRes.json().catch(() => ({}));
                throw new Error(`GitHub (${getRes.status}) : ${b.message || `Erreur lecture ${path}`}`);
            }
            const body = { message, content: btoa(unescape(encodeURIComponent(content))), branch: GITHUB_BRANCH };
            if (sha) body.sha = sha;
            const putRes = await fetch(
                `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}`,
                { method: 'PUT', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' }, body: JSON.stringify(body) }
            );
            if (!putRes.ok) { const err = await putRes.json().catch(() => ({})); throw new Error(err.message || `Erreur commit ${path}`); }
        }
        function buildArticlesJs(arts) {
            const rows = arts.map(a => {
                let obj = '  {\n';
                obj += `    id: ${a.id},\n`;
                obj += `    date: '${a.date}',\n`;
                obj += `    title: ${jsStr(a.title)},\n`;
                obj += `    excerpt: ${jsStr(a.excerpt)},\n`;
                obj += `    category: ${jsStr(a.category)},\n`;
                if (a.slug)                    obj += `    slug: ${jsStr(a.slug)},\n`;
                obj += `    link: ${jsStr(a.link)},\n`;
                if (a.blocks && a.blocks.length) obj += `    blocks: ${JSON.stringify(a.blocks, null, 6).replace(/\n/g, '\n  ')},\n`;
                obj += '  }';
                return obj;
            });
            return `/**\n * Système d'articles — FR RSL\n * Généré le ${new Date().toLocaleDateString('fr-FR')}\n */\n\n` +
                `const ARTICLES = [\n${rows.join(',\n')},\n];\n\n` +
                `function getLatestArticles(n = 3) { return ARTICLES.slice(0, n); }\n` +
                `function getArticlesByCategory(category) { return ARTICLES.filter(a => a.category === category); }\n`;
        }
        function jsStr(s){ return '"' + String(s).replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\n/g,'\\n') + '"'; }
        function escHtml(str){ return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        /* ── Slug ── */
        function slugify(str) {
            return str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
                .replace(/[^a-z0-9\s-]/g,'').trim().replace(/\s+/g,'-').replace(/-+/g,'-').substring(0,80);
        }
        /* ── Blocks editor ── */
        function addBlock(type) {
            const defaults = {
                text:     { type:'text',     content:'' },
                heading:  { type:'heading',  content:'' },
                champion: { type:'champion', name:'', url:'', image:'' },
                kit:      { type:'kit',      src:'', alt:'' }
            };
            currentBlocks.push({ ...defaults[type] });
            renderBlockEditor();
        }
        function updateBlock(idx, key, value) { if (currentBlocks[idx]) currentBlocks[idx][key] = value; }
        function deleteBlock(idx) { currentBlocks.splice(idx, 1); renderBlockEditor(); }
        function moveBlock(idx, dir) {
            const n = idx + dir;
            if (n < 0 || n >= currentBlocks.length) return;
            [currentBlocks[idx], currentBlocks[n]] = [currentBlocks[n], currentBlocks[idx]];
            renderBlockEditor();
        }
        function renderBlockEditor() {
            const container = document.getElementById('blocksList');
            if (!container) return;
            if (!currentBlocks.length) {
                container.innerHTML = '<div class="blocks-empty">Aucun bloc — utilisez les boutons ci-dessus pour ajouter du contenu.</div>';
                return;
            }
            const labels = { text:'Texte', heading:'Titre', champion:'Champion', kit:'Image kit' };
            container.innerHTML = currentBlocks.map((b, i) => {
                const first = i === 0, last = i === currentBlocks.length - 1;
                let body = '';
                if (b.type === 'text') {
                    body = `<textarea placeholder="Contenu du paragraphe…" data-block-update data-idx="${i}" data-key="content">${escHtml(b.content||'')}</textarea>`;
                } else if (b.type === 'heading') {
                    body = `<input type="text" placeholder="Titre de section…" value="${escHtml(b.content||'')}" data-block-update data-idx="${i}" data-key="content">`;
                } else if (b.type === 'champion') {
                    if (b.name && b.url) {
                        const av = b.image
                            ? `<img src="${escHtml(b.image)}" class="csel-img" onerror="this.style.display='none'">`
                            : `<div class="csel-ph">${escHtml(b.name.charAt(0).toUpperCase())}</div>`;
                        body = `<div class="csel">${av}<div class="csel-info"><span class="csel-name">${escHtml(b.name)}</span><span class="csel-url">${escHtml(b.url)}</span></div><button type="button" class="btn btn-ghost btn-sm" data-block-action="clearchamp" data-idx="${i}">✕ Changer</button></div>`;
                    } else {
                        body = `<div class="csearch-wrap"><input type="text" class="csearch-inp" placeholder="Rechercher un champion par nom…" autocomplete="off" data-idx="${i}"><div class="csearch-drop" id="champDrop${i}" style="display:none"></div></div>`;
                    }
                } else if (b.type === 'kit') {
                    body = `<span class="block-label">URL de l'image (depuis la racine)</span>
                        <input type="text" placeholder="assets/images/..." value="${escHtml(b.src||'')}" data-block-update data-idx="${i}" data-key="src">
                        <span class="block-label">Légende (optionnel)</span>
                        <input type="text" placeholder="Kit de compétences de..." value="${escHtml(b.alt||'')}" data-block-update data-idx="${i}" data-key="alt">`;
                }
                return `<div class="block-item">
                    <div class="block-item-header">
                        <span class="block-type-pill type-${b.type}">${labels[b.type]||b.type}</span>
                        <div class="block-btns">
                            <button type="button" ${first?'disabled':''} data-block-action="moveup" data-idx="${i}" title="Monter">↑</button>
                            <button type="button" ${last?'disabled':''} data-block-action="movedown" data-idx="${i}" title="Descendre">↓</button>
                            <button type="button" class="block-btn-del" data-block-action="delete" data-idx="${i}" title="Supprimer">🗑</button>
                        </div>
                    </div>
                    <div class="block-item-body">${body}</div>
                </div>`;
            }).join('');
        }
        function updateSlugPreview() {
            const s  = document.getElementById('fSlug').value.trim();
            const sp = document.getElementById('slugPreview');
            if (!sp) return;
            if (s) { sp.style.display = ''; sp.textContent = `→ pages/articles/${s}.html`; }
            else   { sp.style.display = 'none'; sp.textContent = ''; }
        }
        /* ── Champion autocomplete helpers ── */
        function normStr(s) { return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
        function showChampDropdown(idx, query) {
            const drop = document.getElementById('champDrop' + idx);
            if (!drop) return;
            const q = normStr(query.trim());
            if (!q) { drop.style.display = 'none'; return; }
            const results = (typeof CHAMPIONS !== 'undefined' ? CHAMPIONS : []).filter(c => normStr(c.name).includes(q)).slice(0, 10);
            if (!results.length) {
                drop.innerHTML = '<div class="champ-opt-empty">Aucun champion trouvé</div>';
            } else {
                drop.innerHTML = results.map(c => {
                    const av = c.img
                        ? `<img src="${escHtml(c.img)}" class="champ-opt-img" onerror="this.style.display='none'">`
                        : `<div class="champ-opt-ph">${escHtml(c.name.charAt(0).toUpperCase())}</div>`;
                    return `<div class="champ-opt" data-idx="${idx}" data-name="${escHtml(c.name)}" data-url="${escHtml(c.url)}" data-img="${escHtml(c.img||'')}">${av}<div class="champ-opt-info"><span class="champ-opt-name">${escHtml(c.name)}</span><span class="champ-opt-faction">${escHtml(c.factionName||'')}</span></div></div>`;
                }).join('');
            }
            drop.style.display = '';
        }
        function selectChamp(idx, data) {
            if (!currentBlocks[idx]) return;
            currentBlocks[idx].name  = data.name  || '';
            currentBlocks[idx].url   = data.url   || '';
            currentBlocks[idx].image = data.img   || '';
            renderBlockEditor();
        }
        function clearChampBlock(idx) {
            if (!currentBlocks[idx]) return;
            currentBlocks[idx].name  = '';
            currentBlocks[idx].url   = '';
            currentBlocks[idx].image = '';
            renderBlockEditor();
        }
        function initBlockEditor() {
            document.querySelectorAll('[data-block-type]').forEach(btn => {
                btn.addEventListener('click', () => addBlock(btn.dataset.blockType));
            });
            const list = document.getElementById('blocksList');
            list.addEventListener('click', e => {
                const btn = e.target.closest('[data-block-action]');
                if (!btn) return;
                const idx = parseInt(btn.dataset.idx);
                if (btn.dataset.blockAction === 'delete')    deleteBlock(idx);
                if (btn.dataset.blockAction === 'moveup')    moveBlock(idx, -1);
                if (btn.dataset.blockAction === 'movedown')  moveBlock(idx, 1);
                if (btn.dataset.blockAction === 'clearchamp') clearChampBlock(idx);
            });
            /* mousedown instead of click to fire before blur on search input */
            list.addEventListener('mousedown', e => {
                const opt = e.target.closest('.champ-opt');
                if (!opt) return;
                e.preventDefault();
                selectChamp(parseInt(opt.dataset.idx), opt.dataset);
            });
            list.addEventListener('input', e => {
                const el = e.target.closest('[data-block-update]');
                if (el) { updateBlock(parseInt(el.dataset.idx), el.dataset.key, el.value); return; }
                const si = e.target.closest('.csearch-inp');
                if (si) showChampDropdown(parseInt(si.dataset.idx), si.value);
            });
            /* Auto-slug depuis le titre */
            const titleEl = document.getElementById('fTitle');
            const slugEl  = document.getElementById('fSlug');
            titleEl.addEventListener('input', () => {
                if (!slugEl.dataset.manual) {
                    slugEl.value = slugify(titleEl.value);
                    updateSlugPreview();
                }
            });
            slugEl.addEventListener('input', () => {
                slugEl.dataset.manual = '1';
                updateSlugPreview();
            });
        }
        /* ── Génération HTML article ── */
        function buildArticleHtml(article) {
            const root = '../../';

            const catColors = {

            const readMin = Math.max(1, Math.round(words / 200));

            const blocksHtml = (article.blocks||[]).map(b => {
