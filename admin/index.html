<!DOCTYPEhtml>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — FR RSL</title>
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.github.com https://raw.githubusercontent.com; img-src 'self' https://raw.githubusercontent.com data: blob:; font-src 'self'">
    <link rel="shortcut icon" href="../assets/images/logos/logo.png">
    <link rel="stylesheet" href="../assets/css/main.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }

        .login-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 2px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(20px);
            box-shadow: 0 24px 64px rgba(0,0,0,0.5);
            position: relative;
            z-index: 10;
        }

        .login-logo {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .login-logo img { width: 48px; height: 48px; }
        .login-logo h1 { font-size: 1.6rem; margin: 0; }

        .login-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 2rem;
            margin-top: -1.2rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 0.85rem 1.1rem;
            border-radius: 2px;
            border: 2px solid var(--glass-border);
            background: rgba(255,255,255,0.04);
            color: var(--text-light);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: var(--primary);
        }

        .form-hint {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.4rem;
            line-height: 1.4;
        }

        .form-hint a {
            color: var(--primary);
            text-decoration: none;
        }

        .btn-login {
            width: 100%;
            padding: 0.95rem;
            border-radius: 2px;
            border: none;
            background: var(--primary);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 0.8rem;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-login:hover { background: var(--primary-dark); }
        .btn-login:active { transform: scale(0.98); }

        .error-msg {
            background: rgba(229,57,53,0.15);
            border: 1px solid rgba(229,57,53,0.4);
            border-radius: 2px;
            padding: 0.75rem 1rem;
            color: #ef5350;
            font-size: 0.875rem;
            margin-top: 1rem;
            display: none;
        }

        .admin-badge {
            position: absolute;
            top: 1.2rem;
            right: 1.2rem;
            background: rgba(255,183,0,0.15);
            border: 1px solid rgba(255,183,0,0.3);
            border-radius: 2px;
            padding: 0.3rem 0.7rem;
            font-size: 0.72rem;
            font-weight: 700;
            color: #ffb700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
    </style>
</head>
<body>
    <div class="particles"></div>

    <div class="login-card">
        <span class="admin-badge">Accès Admin</span>

        <div class="login-logo">
            <img src="../assets/images/logos/logo.png" alt="FR RSL">
            <h1>FR RSL</h1>
        </div>
        <p class="login-subtitle">Espace d'administration — accès restreint</p>

        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="ghToken">Token GitHub Personnel (PAT)</label>
                <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off" spellcheck="false">
                <p class="form-hint">
                    Votre token GitHub est l'unique clé d'accès — il est validé directement par GitHub.<br>
                    <a href="https://github.com/settings/tokens?type=beta" target="_blank" rel="noopener noreferrer">→ Générer un fine-grained token</a> avec le scope <code>Contents: Read and write</code> sur ce repo uniquement.
                </p>
            </div>

            <button type="submit" class="btn-login">Connexion</button>
            <div class="error-msg" id="errorMsg"></div>
        </form>
    </div>

    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/security.js"></script>
    <script>
    (function () {
        var GITHUB_REPO = 'FR-RSL/FR-RSL.github.io';

        // Rate limiter : 5 tentatives max sur 15 minutes
        var loginLimiter = new SecurityUtils.RateLimiter('admin_login', 5, 15 * 60 * 1000);

        // Rediriger si déjà connecté
        if (sessionStorage.getItem('admin_token')) {
            window.location.href = 'dashboard.html';
            return;
        }

        function showError(msg) {
            var el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.style.display = 'block';
        }

        function clearError() {
            var el = document.getElementById('errorMsg');
            el.textContent = '';
            el.style.display = 'none';
        }

        // Vérifie le rate limit au chargement pour afficher le délai restant
        (function checkBlockOnLoad() {
            var status = loginLimiter.check();
            if (!status.allowed) {
                var btn = document.querySelector('.btn-login');
                btn.disabled = true;
                showError('Trop de tentatives. Réessayez dans ' + status.waitSec + ' seconde(s).');
                var interval = setInterval(function () {
                    var s = loginLimiter.check();
                    if (s.allowed) {
                        clearInterval(interval);
                        btn.disabled = false;
                        clearError();
                    } else {
                        showError('Trop de tentatives. Réessayez dans ' + s.waitSec + ' seconde(s).');
                    }
                }, 1000);
            }
        })();

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            // Vérification du rate limit avant toute action
            var limitStatus = loginLimiter.check();
            if (!limitStatus.allowed) {
                showError('Trop de tentatives. Réessayez dans ' + limitStatus.waitSec + ' seconde(s).');
                return;
            }

            var token   = SecurityUtils.sanitizeText(document.getElementById('ghToken').value);
            clearError();

            if (!token) {
                showError('Veuillez saisir votre token GitHub.');
                return;
            }

            // Validation basique du format du token GitHub (ghp_, github_pat_, gho_, ghu_, ghs_)
            if (!/^(ghp_|github_pat_|gho_|ghu_|ghs_)[A-Za-z0-9_]+$/.test(token)) {
                showError('Format de token invalide. Les tokens GitHub commencent par ghp_, github_pat_, etc.');
                return;
            }

            var btn = document.querySelector('.btn-login');
            btn.textContent = 'Vérification…';
            btn.disabled = true;

            try {
                // L'authentification repose entièrement sur GitHub (système reconnu).
                // Le token est validé par l'API GitHub — aucun secret n'est stocké ici.
                var res = await fetch('https://api.github.com/repos/' + GITHUB_REPO, {
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'X-GitHub-Api-Version': '2022-11-28'
                    }
                });

                if (!res.ok) {
                    var body = await res.json().catch(function () { return {}; });
                    var detail = body.message || ('HTTP ' + res.status);
                    throw new Error('GitHub (' + res.status + ') : ' + detail);
                }

                // Succès : réinitialise le compteur et stocke le token (effacé à la fermeture du tab)
                loginLimiter.reset();
                sessionStorage.setItem('admin_token', token);
                window.location.href = 'dashboard.html';

            } catch (err) {
                // Échec : enregistre la tentative et affiche l'erreur
                loginLimiter.recordFailure();
                var newStatus = loginLimiter.check();
                var errMsg = err.message || 'Erreur de vérification du token GitHub.';
                if (!newStatus.allowed) {
                    errMsg += ' Compte temporairement bloqué (' + newStatus.waitSec + 's).';
                    btn.disabled = true;
                } else {
                    btn.textContent = 'Connexion';
                    btn.disabled = false;
                }
                showError(errMsg);
            }
        });
    })();
    </script>
</body>
</html>
