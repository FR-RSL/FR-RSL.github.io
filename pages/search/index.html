<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recherche — FR RSL</title>
    <meta name="robots" content="noindex">
    <link rel="shortcut icon" href="../../assets/images/logos/logo.webp">
    <link rel="stylesheet" href="../../assets/css/main.css">
    <style>
        /* ── Layout ──────────────────────────────────── */
        .search-page {
            max-width: 1300px;
            margin: 0 auto;
            padding: 2rem 2rem 4rem;
            position: relative;
            z-index: 10;
        }

        /* ── En-tête de recherche ────────────────────── */
        .search-header {
            margin-bottom: 2rem;
        }

        .search-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
            background: linear-gradient(135deg, var(--text-light), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ── Bloc contrôles (barre + filtres côte à côte) ── */
        .search-controls {
            display: flex;
            gap: 1.5rem;
            align-items: flex-start;
        }

        .filters-panel {
            flex: 1;
            min-width: 0;
        }

        /* ── Barre de recherche ──────────────────────── */
        .search-bar-main {
            display: flex;
            gap: 0;
            flex-shrink: 0;
            width: 360px;
        }

        .search-bar-main input {
            flex: 1;
            padding: 0.75rem 1.2rem;
            border-radius: 2px 0 0 2px;
            border: 1px solid var(--glass-border);
            border-right: none;
            background: var(--glass-bg);
            color: var(--text-light);
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-bar-main input:focus {
            border-color: var(--primary);
        }

        .search-bar-main input::placeholder {
            color: var(--text-muted);
        }

        .search-bar-main button {
            padding: 0.75rem 1.2rem;
            border-radius: 0 2px 2px 0;
            border: 1px solid var(--primary);
            background: var(--primary);
            color: #fff;
            font-weight: 600;
            font-family: inherit;
            font-size: 0.88rem;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .search-bar-main button:hover {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
        }

        /* ── Groupes de filtres ──────────────────────── */
        .filter-group {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 0.55rem;
        }

        .filter-group:last-child {
            margin-bottom: 0;
        }

        .filter-label {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            white-space: nowrap;
            padding-top: 0.38rem;
            min-width: 52px;
            font-family: 'Space Mono', monospace;
        }

        .search-filters {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.3rem 0.85rem;
            border-radius: 2px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: var(--text-muted);
            font-size: 0.78rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .filter-btn:hover {
            color: var(--text-light);
            border-color: rgba(232,121,14,0.4);
        }

        .filter-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        /* ── Méta résultats ──────────────────────────── */
        .search-meta {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 1.2rem;
            margin-top: 1.5rem;
            font-family: 'Space Mono', monospace;
        }

        .search-meta strong {
            color: var(--text-light);
        }

        /* ── Grille de résultats ─────────────────────── */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
            gap: 0.8rem;
        }

        .champion-result {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-light);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 2px;
            padding: 1rem 0.75rem 0.85rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            gap: 0.5rem;
            text-align: center;
        }

        .champion-result:hover {
            box-shadow: 0 6px 20px rgba(0,0,0,0.35);
        }

        /* Bordures de rareté */
        .champion-result.rarity-mythical  { border-color: rgba(229,57,53,0.25); }
        .champion-result.rarity-legendary { border-color: rgba(255,183,0,0.25); }
        .champion-result.rarity-epic      { border-color: rgba(162,89,230,0.25); }
        .champion-result.rarity-rare      { border-color: rgba(52,152,219,0.25); }
        .champion-result.rarity-uncommon  { border-color: rgba(76,175,80,0.25); }
        .champion-result.rarity-common    { border-color: rgba(158,158,158,0.15); }

        .champion-result.rarity-mythical:hover  { border-color: #e53935; box-shadow: 0 6px 20px rgba(229,57,53,0.2); }
        .champion-result.rarity-legendary:hover { border-color: #ffb700; box-shadow: 0 6px 20px rgba(255,183,0,0.2); }
        .champion-result.rarity-epic:hover      { border-color: #a259e6; box-shadow: 0 6px 20px rgba(162,89,230,0.2); }
        .champion-result.rarity-rare:hover      { border-color: #3498db; box-shadow: 0 6px 20px rgba(52,152,219,0.2); }
        .champion-result.rarity-uncommon:hover  { border-color: #4caf50; box-shadow: 0 6px 20px rgba(76,175,80,0.2); }
        .champion-result.rarity-common:hover    { border-color: #9e9e9e; box-shadow: 0 6px 20px rgba(158,158,158,0.15); }

        .result-portrait {
            width: 96px;
            height: 116px;
            border-radius: 2px;
            object-fit: cover;
            object-position: center top;
            background: rgba(255,255,255,0.04);
            flex-shrink: 0;
        }

        .result-portrait-placeholder {
            width: 96px;
            height: 116px;
            border-radius: 2px;
            background: rgba(255,255,255,0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            flex-shrink: 0;
        }

        .result-name {
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.3;
        }

        .result-faction {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .result-faction img {
            width: 13px;
            height: 13px;
            object-fit: contain;
            opacity: 0.75;
        }

        .result-rarity {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.15rem 0.5rem;
            border-radius: 2px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-family: 'Space Mono', monospace;
        }

        .rarity-mythical  .result-rarity { background: rgba(229,57,53,0.15);  color: #ef5350; }
        .rarity-legendary .result-rarity { background: rgba(255,183,0,0.15);  color: #ffb700; }
        .rarity-epic      .result-rarity { background: rgba(162,89,230,0.15); color: #a259e6; }
        .rarity-rare      .result-rarity { background: rgba(52,152,219,0.15); color: #3498db; }
        .rarity-uncommon  .result-rarity { background: rgba(76,175,80,0.15);  color: #4caf50; }
        .rarity-common    .result-rarity { background: rgba(158,158,158,0.15);color: #9e9e9e; }

        /* ── État vide ───────────────────────────────── */
        .search-empty {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }

        .search-empty .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .search-empty h2 {
            font-size: 1.3rem;
            color: var(--text-light);
            margin-bottom: 0.5rem;
        }

        /* ── Responsive ──────────────────────────────── */
        @media (max-width: 900px) {
            .search-controls { flex-direction: column; }
            .search-bar-main { width: 100%; }
        }

        @media (max-width: 640px) {
            .results-grid { grid-template-columns: repeat(2, 1fr); }
            .filter-group { flex-direction: column; gap: 0.4rem; }
            .filter-label { padding-top: 0; }
        }

        @media (max-width: 360px) {
            .results-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-section">
            <a href="../../index.html" style="display:flex;align-items:center;gap:0.7rem;text-decoration:none;color:inherit;">
                <img src="../../assets/images/logos/logo.webp" alt="Logo FR RSL">
                <h1>FR RSL</h1>
            </a>
        </div>
        <nav class="quick-nav" style="margin:0;">
            <a href="../../index.html" class="nav-pill">← Accueil</a>
        </nav>
    </header>

    <div class="search-page">

        <div class="search-header">
            <h1>Recherche de champions</h1>
            <div class="search-controls">
                <form class="search-bar-main" id="searchForm" role="search">
                    <input
                        type="text"
                        id="searchInput"
                        name="q"
                        placeholder="Nom du champion…"
                        autocomplete="off"
                        aria-label="Rechercher un champion"
                    >
                    <button type="submit">🔍 Chercher</button>
                </form>

                <div class="filters-panel">
                    <div class="filter-group">
                        <span class="filter-label">Rareté</span>
                        <div class="search-filters" id="rarityFilters">
                            <button class="filter-btn active" data-rarity="all">Tous</button>
                            <button class="filter-btn" data-rarity="mythical">Mythiques</button>
                            <button class="filter-btn" data-rarity="legendary">Légendaires</button>
                            <button class="filter-btn" data-rarity="epic">Épiques</button>
                            <button class="filter-btn" data-rarity="rare">Rares</button>
                            <button class="filter-btn" data-rarity="uncommon">Peu communs</button>
                            <button class="filter-btn" data-rarity="common">Communs</button>
                        </div>
                    </div>

                    <div class="filter-group">
                        <span class="filter-label">Faction</span>
                        <div class="search-filters" id="factionFilters"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="search-meta" id="searchMeta"></div>
        <div class="results-grid" id="resultsGrid"></div>

    </div>

    <footer>
        <div class="footer-content">
            <div class="footer-sections">
                <div class="footer-section">
                    <h4>Navigation</h4>
                    <div class="footer-links">
                        <a href="../../index.html">Accueil</a>
                        <a href="../../index.html#factions">Factions</a>
                    </div>
                </div>
                <div class="footer-section">
                    <h4>Ressources</h4>
                    <div class="footer-links">
                    </div>
                </div>
            </div>
            <div class="footer-bottom">
                <p>© 2026 FR RSL &mdash; <small>Site non-officiel, non affilié à Plarium Games.</small></p>
            </div>
        </div>
    </footer>

    <script src="../../assets/js/champions-index.js"></script>
    <script src="../../assets/js/champion-sort-data.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
    (function () {
        const input        = document.getElementById('searchInput');
        const meta         = document.getElementById('searchMeta');
        const grid         = document.getElementById('resultsGrid');
        const form         = document.getElementById('searchForm');

        let currentQuery   = '';
        let currentRarity  = 'all';
        let currentFaction = 'all';

        /* ── Lire le paramètre ?q= depuis l'URL ── */
        const urlParams = new URLSearchParams(window.location.search);
        const urlQuery  = (urlParams.get('q') || '').trim();
        if (urlQuery) {
            input.value  = urlQuery;
            currentQuery = urlQuery.toLowerCase();
        }

        /* ── Générer les boutons de faction ── */
        const factionFilters = document.getElementById('factionFilters');
        factionFilters.innerHTML =
            '<button class="filter-btn faction-btn active" data-faction="all">Toutes</button>' +
            Object.entries(FACTION_META).map(([key, val]) =>
                `<button class="filter-btn faction-btn" data-faction="${key}">${val.name}</button>`
            ).join('');

        /* ── Filtres de rareté ── */
        document.querySelectorAll('#rarityFilters .filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#rarityFilters .filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentRarity = btn.dataset.rarity;
                render();
            });
        });

        /* ── Filtres de faction ── */
        document.querySelectorAll('.faction-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.faction-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFaction = btn.dataset.faction;
                render();
            });
        });

        /* ── Soumission du formulaire ── */
        form.addEventListener('submit', e => {
            e.preventDefault();
            currentQuery = input.value.trim().toLowerCase();
            const url = new URL(window.location.href);
            if (currentQuery) url.searchParams.set('q', input.value.trim());
            else url.searchParams.delete('q');
            window.history.replaceState({}, '', url);
            render();
        });

        /* ── Saisie en temps réel ── */
        input.addEventListener('input', () => {
            currentQuery = input.value.trim().toLowerCase();
            render();
        });

        /* ── Rendu ── */
        function render() {
            const results = CHAMPIONS.filter(c => {
                const matchQuery   = !currentQuery || normalize(c.name).includes(normalize(currentQuery));
                const matchRarity  = currentRarity  === 'all' || c.rarity  === currentRarity;
                const matchFaction = currentFaction === 'all' || c.faction === currentFaction;
                return matchQuery && matchRarity && matchFaction;
            }).sort((a, b) => {
                if (a.faction !== b.faction) return a.faction.localeCompare(b.faction);
                const RARITY_ORDER = { mythical: 0, legendary: 1, epic: 2, rare: 3, uncommon: 4, common: 5 };
                if (a.rarity !== b.rarity) return (RARITY_ORDER[a.rarity] ?? 99) - (RARITY_ORDER[b.rarity] ?? 99);
                const sa = (typeof CHAMPION_SORT !== 'undefined' && CHAMPION_SORT[a.folder]) || { a: 99, i: 99999 };
                const sb = (typeof CHAMPION_SORT !== 'undefined' && CHAMPION_SORT[b.folder]) || { a: 99, i: 99999 };
                if (sa.a !== sb.a) return sa.a - sb.a;
                return sa.i - sb.i;
            });

            if (currentQuery) {
                meta.innerHTML = `<strong>${results.length}</strong> résultat${results.length !== 1 ? 's' : ''} pour « <strong>${escHtml(input.value.trim())}</strong> »`;
            } else {
                meta.innerHTML = `<strong>${results.length}</strong> champion${results.length !== 1 ? 's' : ''}`;
            }

            if (results.length === 0) {
                grid.innerHTML = `
                    <div class="search-empty" style="grid-column:1/-1">
                        <div class="empty-icon">😶</div>
                        <h2>Aucun champion trouvé</h2>
                        <p>Essayez un autre nom ou modifiez les filtres.</p>
                    </div>`;
                return;
            }

            grid.innerHTML = results.map(c => `
                <a href="../../${c.url}" class="champion-result rarity-${c.rarity}">
                    ${c.img
                        ? `<img class="result-portrait" src="../../${c.img}" alt="${escHtml(c.name)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                           <div class="result-portrait-placeholder" style="display:none">⚔️</div>`
                        : `<div class="result-portrait-placeholder">⚔️</div>`
                    }
                    <span class="result-rarity">${{mythical:'Mythique',legendary:'Légendaire',epic:'Épique',rare:'Rare',uncommon:'Peu commun',common:'Commun'}[c.rarity]||c.rarity}</span>
                    <span class="result-name">${escHtml(c.name)}</span>
                    <div class="result-faction">
                        <img src="../../${c.factionImg}" alt="${escHtml(c.factionName)}">
                        ${escHtml(c.factionName)}
                    </div>
                </a>`
            ).join('');
        }

        /* ── Utilitaires ── */
        function normalize(str) {
            return str.toLowerCase()
                .normalize('NFD').replace(/\p{Diacritic}/gu, '')
                .replace(/['']/g, "'");
        }

        function escHtml(str) {
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        /* ── Rendu initial ── */
        render();
    })();
    </script>
</body>
</html>
